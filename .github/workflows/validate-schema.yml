name: Validacao isolada de Schema — Fase 8 BLOQUEADA

on:
  workflow_dispatch:
    inputs:
      revisao_aprovada:
        description: 'Fase 8 suspensa. SHA exato exigido somente apos nova autorizacao independente.'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: schema-validation-isolated
  cancel-in-progress: false

jobs:
  validate:
    # Bloqueio literal deliberado. Nao remover sem nova auditoria e autorizacao expressa.
    if: ${{ false && github.repository == 'anselmoads83/anselmo-schema-validation' && github.ref == 'refs/heads/main' && inputs.revisao_aprovada == github.sha }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SCHEMA_APPROVED_REVISION: ${{ inputs.revisao_aprovada }}
    steps:
      - name: Ler exclusivamente o repositorio de validacao
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          submodules: false
      - name: Ler base publica fixa sem escrever no original
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: anselmoads83/mei-conecta-f-cil
          ref: 97632988b7c9f1ffca113f9ddaaa1b801cc76259
          path: comparison/base
          persist-credentials: false
          submodules: false
      - name: Conferir politica, material e lockfile sem instalar dependencias
        shell: bash
        run: bash prepare-comparison.sh
      - name: Supervisor restrito — sem aquisicao conectada ou fallback
        shell: bash
        run: bash isolate-runtime.sh
