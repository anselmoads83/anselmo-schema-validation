name: Validacao isolada de Schema — somente manual

on:
  workflow_dispatch:
    inputs:
      autorizacao:
        description: 'Somente apos autorizacao expressa da Fase 8: digite FASE8-AUTORIZADA'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: schema-validation-isolated
  cancel-in-progress: false

jobs:
  validate:
    if: github.repository == 'anselmoads83/anselmo-schema-validation' && github.ref == 'refs/heads/main' && inputs.autorizacao == 'FASE8-AUTORIZADA'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Ler exclusivamente o repositorio de validacao
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          submodules: false
      - name: Preparar Node.js 22 sem cache
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          check-latest: false
      - name: Ler copia publica da base fixa — nenhuma escrita no original
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: anselmoads83/mei-conecta-f-cil
          ref: 97632988b7c9f1ffca113f9ddaaa1b801cc76259
          path: comparison/base
          persist-credentials: false
          submodules: false
      - name: Preparar comparacao e instalar somente pelo lockfile
        shell: bash
        run: bash prepare-comparison.sh
      - name: Comprovar bloqueio e executar em namespace sem rede externa
        shell: bash
        run: bash isolate-runtime.sh
